name: Sonde sources (temporaire)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas casabourse beautifulsoup4 lxml
      - run: python outils/sonde.py
      - run: python -c "import json;d=json.load(open('listing.json'));print(json.dumps(d)[:3000])" || true
