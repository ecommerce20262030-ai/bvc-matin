name: BVC Matin - mise à jour quotidienne

on:
  schedule:
    # Heures en UTC. 07:00 UTC = 8h00 au Maroc (GMT+1) : la page est prête avant 9h.
    - cron: "0 7 * * 1-5"
    # 15:00 UTC = 16h00 au Maroc : bilan après la clôture de 15h30.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main (aussi depuis l'app GitHub)

permissions:
  contents: write           # pour enregistrer le journal des suggestions (bilan réel)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte et diagnostic de toutes les valeurs
        run: python lancer.py --sortie site
      - name: Enregistrer le journal des suggestions
        run: |
          git config user.name "bvc-matin"
          git config user.email "bvc-matin@users.noreply.github.com"
          git add data/suivi_suggestions.csv
          git diff --cached --quiet || git commit -m "Journal des suggestions $(date -u +%F)"
          git push || echo "Journal non enregistré (sera repris à la prochaine exécution)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
