<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BVC Matin">
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BVC Matin</title>
<style>
/* Mise en page : en-tête fixe, contenu en une colonne, barre de 3 onglets en bas.
   Couleur d'accent : bleu Majorelle, réservé aux actions ; vert/rouge = hausse/baisse uniquement. */
:root{
  --bg:#f3f5f9;--surface:#ffffff;--surface2:#eceff5;--text:#121a2b;--muted:#5e6779;--line:#dde2ec;
  --accent:#2347c4;--accent-ink:#ffffff;--accent-soft:#e6ebfb;
  --up:#11804f;--up-bg:#e1f3ea;--down:#c0372f;--down-bg:#fbe6e4;--warn:#9a5d00;--warn-bg:#fdf0d8;--info:#2347c4;--info-bg:#e6ebfb;
  --hh:56px;--nav:62px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c111b;--surface:#141b28;--surface2:#1b2434;--text:#e8ecf4;--muted:#93a0b5;--line:#253045;
  --accent:#7d9cff;--accent-ink:#0c1430;--accent-soft:#1c2747;
  --up:#45c08a;--up-bg:#13301f;--down:#ff7d73;--down-bg:#3a1a19;--warn:#e9b24a;--warn-bg:#352812;--info:#7d9cff;--info-bg:#1c2747;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[dir=rtl] body{font-family:"Noto Sans Arabic","Segoe UI","Geeza Pro",Tahoma,var(--f)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
[hidden]{display:none!important}

/* En-tête */
.tete{position:fixed;inset:0 0 auto;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.tete .in{height:var(--hh);max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.tete h1{margin:0;font-size:19px;letter-spacing:-.2px;line-height:1.1}
.tete .titre{flex:1;min-width:0}
.tete .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.ico svg{width:22px;height:22px}

.wrap{max-width:720px;margin:0 auto;padding:calc(var(--hh) + env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) calc(var(--nav) + env(safe-area-inset-bottom) + 20px) max(16px,env(safe-area-inset-left))}
.stack{display:grid;gap:12px}
.stack>*{min-width:0}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0;overflow-wrap:anywhere}
h2{font-size:17px;margin:0;letter-spacing:-.1px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:8px 2px 0}
.lien{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:10px 0;min-height:44px}
a{color:var(--accent)}

/* Bandeaux */
.demo{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:12px;font-weight:600;font-size:13px}
.perime{background:var(--down-bg);color:var(--down);padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600}
.installer{border:1px solid var(--accent);background:var(--accent-soft)}
.installer ol{margin:8px 0 0;padding-inline-start:20px;line-height:1.6;font-size:14px}
.alerte-bandeau{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-bg);color:var(--warn);border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;width:100%;text-align:start;min-height:44px}

/* Marché : une seule ligne */
.marche{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.marche .val{font-size:22px;font-weight:700;white-space:nowrap}
.breadth{grid-column:1/-1;display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-top:6px}
.breadth i{display:block}
.legend{grid-column:1/-1;display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.pill.up{background:var(--up-bg)}.pill.down{background:var(--down-bg)}.pill.flat{background:var(--surface2)}

/* Propositions */
.props{display:grid;gap:10px}
.prop{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;display:grid;gap:4px;min-width:0;text-align:start;width:100%}
.prop:active{background:var(--surface2)}
.prop .h{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.prop .n{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prop .m{font-size:14px;color:var(--muted)}
.prop .r{font-size:14px;line-height:1.4}
.statut{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.s-fav{background:var(--up-bg);color:var(--up)}.s-surv{background:var(--warn-bg);color:var(--warn)}
.s-vente{background:var(--down-bg);color:var(--down)}.s-hors,.s-peu{background:var(--surface2);color:var(--muted)}
.vide{color:var(--muted);font-size:14px;line-height:1.5}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.honnete{background:var(--warn-bg);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}

/* Liste des valeurs */
.outils{display:flex;gap:8px;margin:2px 0 8px}
.outils input{flex:1;min-width:0}
.outils select{flex:0 1 46%;min-width:0}
input,select{min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;width:100%;max-width:100%}
.liste{padding:4px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.row:first-child{border-top:0}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:13px}
.row .px{text-align:end}
svg.spark{width:64px;height:24px;display:block;direction:ltr}

/* Boutons */
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface2);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--down)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns.col{display:grid;grid-template-columns:1fr 1fr}
.btns.col .btn{width:100%}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* Indicateurs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media(min-width:520px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface2);border-radius:12px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 4px}
.stats div{background:var(--surface2);border-radius:10px;padding:7px 8px;min-width:0}
.stats b{display:block;font-size:15px;white-space:nowrap}.stats span{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{text-align:start;padding:7px 4px;border-top:1px solid var(--line);overflow-wrap:anywhere}
th{color:var(--muted);font-weight:500;font-size:12px;border-top:0}
td.r,th.r{text-align:end}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.baisse,.tag.vente{background:var(--down-bg);color:var(--down)}.tag.hausse,.tag.achat{background:var(--up-bg);color:var(--up)}
.tag.info{background:var(--info-bg);color:var(--info)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.plan{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;line-height:1.5}
.sugg{border-top:1px solid var(--line);padding:12px 0}.sugg:first-of-type{border-top:0}
.sugg .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
details.plus{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.plus>summary{list-style:none;cursor:pointer;padding:14px;min-height:48px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.plus>summary::-webkit-details-marker{display:none}
details.plus>summary::after{content:"＋";color:var(--muted);font-weight:400}
details.plus[open]>summary::after{content:"−"}
details.plus>.corps{padding:0 14px 14px;min-width:0;overflow-wrap:anywhere}

/* Couches plein écran : fiche d'une valeur et réglages */
.couche{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.couche .barre{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.couche .barre .in{height:var(--hh);max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.couche .barre b{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.couche .corps{max-width:720px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
[dir=rtl] .retour svg{transform:scaleX(-1)}
.prix{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prix .gros{font-size:32px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
.big{width:100%;height:170px;margin:8px 0 2px;display:block;direction:ltr}
.verdict{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.prop-txt p{margin:8px 0 0;font-size:15px;line-height:1.5}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form2>*{min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:500}
.reg h2{margin:22px 2px 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.reg h2:first-child{margin-top:4px}

/* Fiches de saisie (bas d'écran) */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:45;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media(min-width:720px){.sheet{align-items:center}.panel{border-radius:20px}}
.panel h3{margin:0 0 4px;font-size:19px}
.close{float:right;border:0;background:var(--surface2);width:40px;height:40px;border-radius:50%;font-size:20px}
[dir=rtl] .close{float:left}

/* Positions du portefeuille */
.pos{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.pos:first-child{border-top:0}
.pos .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pos .n{font-weight:700}
.alerte{padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.4}
.alerte.baisse{background:var(--down-bg);color:var(--down)}.alerte.hausse{background:var(--up-bg);color:var(--up)}.alerte.warn{background:var(--warn-bg);color:var(--warn)}
.gros-net{font-size:26px;font-weight:700;white-space:nowrap}

/* Barre d'onglets */
nav.bas{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px,env(safe-area-inset-left))}
nav.bas .in{display:flex;max-width:520px;margin:0 auto;height:var(--nav)}
nav.bas button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.bas button svg{width:24px;height:24px}
nav.bas button[aria-selected=true]{color:var(--accent)}
.badge{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);background:var(--down);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
footer{color:var(--muted);font-size:12px;margin:18px 2px 0;line-height:1.5}
body.fige{overflow:hidden}
</style>
</head>
<body>
<header class="tete"><div class="in">
  <div class="titre"><h1>BVC Matin</h1><span class="sub" id="seance"></span></div>
  <button class="ico" id="b-langue" type="button"></button>
  <button class="ico" id="b-reglages" type="button" data-i18n-aria="reg.ouvrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<div class="wrap">
  <!-- AUJOURD'HUI -->
  <section id="v-auj" class="stack">
    <div id="demo" class="demo hidden" data-i18n="app.demo"></div>
    <div id="perime" class="perime hidden"></div>
    <div class="card installer hidden" id="installer"></div>
    <div id="bandeau-alertes"></div>
    <div class="card marche" id="marche"></div>
    <div class="sec"><h2 data-i18n="prop.titre"></h2><button class="lien" type="button" data-reglages="1" data-i18n="prop.modifier"></button></div>
    <div class="sub" id="prop-reglage" style="margin:-6px 2px 0"></div>
    <div id="propositions" class="stack"></div>
    <div class="sec"><h2 data-i18n="liste.titre"></h2><span class="sub num" id="liste-n"></span></div>
    <div class="outils">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="val.recherche">
      <select id="tri" data-i18n-aria="liste.tri">
        <option value="var_jour:asc" data-i18n="tri.var_asc"></option>
        <option value="var_jour:desc" data-i18n="tri.var_desc"></option>
        <option value="nom:asc" data-i18n="tri.nom"></option>
        <option value="ecart_bas_52s:asc" data-i18n="tri.bas"></option>
        <option value="capitaux_moy:desc" data-i18n="tri.liquidite"></option>
        <option value="ratio_volume:desc" data-i18n="tri.volume"></option>
        <option value="attention:desc" data-i18n="tri.attention"></option>
        <option value="amplitude_moy:desc" data-i18n="tri.amplitude"></option>
        <option value="var_ytd:asc" data-i18n="tri.ytd"></option>
      </select>
    </div>
    <div class="card liste" id="liste"></div>
    <details class="plus" id="d-signaux"><summary id="s-signaux"></summary><div class="corps">
      <div class="note" data-i18n-html="sugg.note"></div>
      <div class="chips" id="f-sugg" style="margin:10px 0 2px">
        <button class="chip" data-f="validees" aria-pressed="true" data-i18n="filtre.validees"></button>
        <button class="chip" data-f="achat" aria-pressed="false" data-i18n="filtre.achat"></button>
        <button class="chip" data-f="vente" aria-pressed="false" data-i18n="filtre.vente"></button>
        <button class="chip" data-f="toutes" aria-pressed="false" data-i18n="filtre.toutes"></button>
      </div>
      <div id="liste-sugg"></div>
    </div></details>
    <details class="plus"><summary data-i18n="plus.bilan"></summary><div class="corps" id="bilan"></div></details>
    <footer id="pied"></footer>
  </section>

  <!-- PORTEFEUILLE -->
  <section id="v-pf" class="stack hidden">
    <div class="seg" id="seg-pf" role="group">
      <button type="button" data-seg="reel" aria-pressed="true" data-i18n="pf.reel"></button>
      <button type="button" data-seg="sim" aria-pressed="false" data-i18n="pf.sim"></button>
    </div>
    <div id="pf-reel" class="stack">
      <div class="card" id="pf-resume"></div>
      <div class="card" id="pf-liste"></div>
    </div>
    <div id="pf-sim" class="stack hidden">
      <div class="note" data-i18n="sim.note"></div>
      <div class="card" id="sim-resume"></div>
      <div class="card" id="sim-positions"></div>
      <div class="card" id="sim-journal"></div>
    </div>
  </section>

  <!-- IA : contenu construit par ia.js -->
  <section id="v-ia" class="hidden"></section>
</div>

<!-- Fiche d'une valeur -->
<section class="couche" id="fiche" hidden role="dialog" aria-modal="true">
  <div class="barre"><div class="in">
    <button class="ico retour" type="button" data-fermer-couche="1" data-i18n-aria="retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <b id="fiche-titre"></b></div></div>
  <div class="corps" id="fiche-corps"></div>
</section>

<!-- Réglages -->
<section class="couche" id="reglages" hidden role="dialog" aria-modal="true">
  <div class="barre"><div class="in">
    <button class="ico retour" type="button" data-fermer-couche="1" data-i18n-aria="retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <b data-i18n="reg.titre"></b></div></div>
  <div class="corps reg" id="reglages-corps"></div>
</section>

<nav class="bas"><div class="in" role="tablist">
  <button data-v="auj" aria-selected="true" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 7-8"/><path d="M15 7h4v4"/></svg><span data-i18n="nav.auj"></span></button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>

<script>
__TEXTES__
</script>
<script>
const D = __DONNEES__;
const V = D.valeurs, M = D.marche;
const PAR_ISIN = Object.fromEntries(V.map(f => [f.isin, f]));
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- Stockage local (reste sur l'appareil) ---------- */
const store = {
  get(k, def) { try { const v = localStorage.getItem("bvc." + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem("bvc." + k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- Langue ---------- */
let LANG = store.get("langue", null) || ((navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "fr");
const LOC_DATE = () => LANG === "ar" ? "ar-MA-u-nu-latn" : "fr-FR";
function t(cle, p = {}) {
  const s = (TEXTES[LANG] && TEXTES[LANG][cle]) ?? TEXTES.fr[cle] ?? cle;
  return s.replace(/\{(\w+)\}/g, (_, k) => p[k] ?? "");
}
// En arabe, chaque nombre est isolé pour garder le signe et le % à la bonne place.
const iso = s => LANG === "ar" ? "⁦" + s + "⁩" : s;

/* ---------- Formats ---------- */
const brut = (x, d = 2) => Number(x).toLocaleString("fr-FR", {minimumFractionDigits: d, maximumFractionDigits: d});
const pc = (x, d = 2) => x == null || isNaN(x) ? "—" : iso(brut(x, d) + " %");
const fmt = (x, d = 2) => x == null || isNaN(x) ? "—" : iso(Number(x).toLocaleString("fr-FR", {minimumFractionDigits: d, maximumFractionDigits: d}));
const mad = (x, d = 2) => fmt(x, d) + " " + t("mad");
const pct = x => x == null || isNaN(x) ? "—" : iso((x > 0 ? "+" : "") + Number(x).toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " %");
const cls = x => x == null || x === 0 || isNaN(x) ? "flat" : x > 0 ? "up" : "down";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dateLongue = s => s ? new Date(s + "T12:00:00").toLocaleDateString(LOC_DATE(), {weekday:"long", day:"numeric", month:"long", year:"numeric"}) : "—";
const dateCourte = s => s ? iso(new Date(s + "T12:00:00").toLocaleDateString("fr-FR")) : "—";
const aujourdhui = () => new Date().toISOString().slice(0, 10);
const nomRegle = code => t("regle." + code);
const explRegle = code => t("regle." + code + ".x");
const motif = r => r.motif_i18n ? t("motif." + r.motif_i18n.code, {...r.motif_i18n, t: pc(r.motif_i18n.t, 0)}) : (r.motif || "");
const texteSignal = s => s.code ? t("sig." + s.code, {v: s.code === "forte_baisse" || s.code === "forte_hausse" ? pct(s.v) :
  s.code === "dividende" ? pct(-s.v) : s.code.startsWith("rsi") ? fmt(s.v, 0) : fmt(s.v, 1)}) : s.texte;

let R = Object.assign({courtage: 0.6, taxe: 0.1, stop: -7, objectif: 10, capital: 50000, risque: 1, obj: 2, seuil: 3, duree: 5, lignes: 5}, store.get("reglages", {}));
let PF = store.get("portefeuille", []);
let SIM = store.get("simulation", null) || {capital: 1000000, cash: 1000000, positions: {}, journal: []};
const sauver = () => { store.set("reglages", R); store.set("portefeuille", PF); store.set("simulation", SIM); };

function frais(montant, sens) {
  const c = montant * R.courtage / 100 * 1.2;
  return sens === "vente" ? c + montant * R.taxe / 100 : c;
}

/* ---------- Petits graphiques ---------- */
function spark(h, w = 64, ht = 24) {
  if (!h || h.length < 2) return "<span></span>";
  const lo = Math.min(...h), hi = Math.max(...h), r = hi - lo || 1;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * w).toFixed(1)},${(ht - 2 - (v - lo) / r * (ht - 4)).toFixed(1)}`).join(" ");
  const col = h[h.length - 1] >= h[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function courbe(h) {
  const W = 640, H = 170, P = 6;
  if (!h || h.length < 2) return `<div class="vide">${t("courbe.vide")}</div>`;
  const lo = Math.min(...h), hi = Math.max(...h), r = hi - lo || 1;
  const xy = h.map((v, i) => [(i / (h.length - 1) * W).toFixed(1), (H - P - (v - lo) / r * (H - 2 * P)).toFixed(1)]);
  const pts = xy.map(p => p.join(",")).join(" ");
  const col = h[h.length - 1] >= h[0] ? "var(--up)" : "var(--down)";
  return `<svg class="big" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,${H} ${pts} ${W},${H}" fill="${col}" opacity=".08"/>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="sub num">${t("courbe.info", {n: fmt(h.length, 0), lo: fmt(lo), hi: fmt(hi), v: pct((h[h.length - 1] / h[0] - 1) * 100)})}</div>`;
}

/* ---------- Ligne de la liste ---------- */
function ligne(f, extra = "") {
  return `<div class="row" data-isin="${f.isin}" role="button" tabindex="0">
    <div style="min-width:0"><div class="n">${esc(f.nom)}</div><div class="meta num">${mad(f.cours)}${extra}</div></div>
    ${spark(f.historique.slice(-60))}
    <div class="px num"><span class="pill ${cls(f.var_jour)}">${pct(f.var_jour)}</span></div></div>`;
}
const tags = (f, max = 3) => f.signaux.slice(0, max).map(s => `<span class="tag ${s.type}">${esc(texteSignal(s))}</span>`).join("");

/* ---------- Règles techniques (signaux) ---------- */
function taille(p) {
  // Quantité telle que la perte, si le seuil de sortie est touché, reste ≤ risque % du capital.
  if (!p || !(p.entree > p.stop)) return null;
  const perteParAction = p.entree - p.stop + frais(p.entree, "achat") + frais(p.stop, "vente");
  let q = Math.floor(R.capital * R.risque / 100 / perteParAction);
  q = Math.min(q, Math.floor(R.capital / (p.entree + frais(p.entree, "achat"))));
  let limite = null;
  if (p.montant_max_liquidite && q * p.entree > p.montant_max_liquidite) { q = Math.floor(p.montant_max_liquidite / p.entree); limite = "liquidite"; }
  return {q, montant: q * p.entree, perte: q * perteParAction, limite};
}
function htmlPlan(s) {
  const p = s.plan; if (!p) return "";
  const tl = taille(p);
  return `<div class="plan num"><b>${t("plan.titre")}</b> · ${t("plan.ref", {p: fmt(p.entree)})}<br>
    ${t("plan.ligne", {s: fmt(p.stop), sp: pct(p.stop_pct), o: fmt(p.objectif), op: pct(p.objectif_pct), d: p.duree})}<br>
    ${tl && tl.q > 0 ? t("plan.profil", {q: fmt(tl.q, 0), m: mad(tl.montant, 0), p: mad(tl.perte, 0)}) + (tl.limite ? t("plan.liq") : "") : t("plan.faible")}</div>`;
}
const TOUTES_SUGG = V.flatMap(f => (f.suggestions || []).map(s => ({...s, f})))
  .sort((a, b) => (b.fiable - a.fiable) || (a.sens === "achat" ? -1 : 1) - (b.sens === "achat" ? -1 : 1) || Math.abs(b.gain_moyen ?? 0) - Math.abs(a.gain_moyen ?? 0));

function carteSugg(s) {
  const f = s.f, achat = s.sens === "achat";
  const taux = x => x == null ? "—" : pc(x, 0);
  return `<div class="sugg">
    <div class="t"><div style="min-width:0"><b>${esc(f.nom)}</b> <span class="sub num">${mad(f.cours)}</span></div>
      <span class="pill ${cls(f.var_jour)}">${pct(f.var_jour)}</span></div>
    <div class="tags" style="margin-top:6px">
      <span class="tag ${s.sens}">${achat ? t("sugg.achat") : t("sugg.vente")}</span>
      <span class="tag ${s.fiable ? "info" : "warn"}">${s.fiable ? t("sugg.validee") : t("sugg.nonvalidee")}</span>
      <span class="tag">${esc(nomRegle(s.code))}</span></div>
    <div class="sub" style="margin-top:6px">${esc(explRegle(s.code))}</div>
    <div class="stats num">
      <div><span>${t("st.ops")}</span><b>${fmt(s.operations, 0)}</b></div>
      <div><span>${achat ? t("st.gagnantes") : t("st.baisses")}</span><b>${taux(s.taux_reussite)}</b></div>
      <div><span>${achat ? t("st.gain") : t("st.var")}</span><b class="${cls(achat ? s.gain_moyen : -s.gain_moyen)}">${pct(s.gain_moyen)}</b></div>
      <div><span>${t("st.pire")}</span><b class="${cls(s.pire)}">${pct(s.pire)}</b></div>
    </div>
    ${s.recent ? `<div class="sub num">${t("sugg.recent", {d: dateCourte(s.debut_recent), n: fmt(s.recent.operations, 0), t: taux(s.recent.taux_reussite),
      lab: achat ? t("sugg.recent.g") : t("sugg.recent.b"), m: pct(s.recent.gain_moyen)})}</div>` : ""}
    ${s.fiable ? "" : `<div class="sub" style="color:var(--warn)">${t("sugg.pourquoi", {m: esc(motif(s))})}</div>`}
    ${achat ? htmlPlan(s) : ""}
    <div class="btns"><button class="btn" data-detail="${f.isin}" type="button">${t("sugg.detail")}</button>
      ${achat ? `<button class="btn" data-sim="${f.isin}" data-qte="${taille(s.plan)?.q || ""}" type="button">${t("sugg.simuler")}</button>` : ""}</div></div>`;
}
function carteBilan(titre, note, b, vide) {
  const a = b?.achats_clos || {nombre: 0};
  const regles = Object.entries(b?.par_regle || {});
  const etat = l => l.statut === "clos" ? t("sortie." + l.sortie) : l.statut === "attente" ? t("bilan.attente") : t("bilan.encours");
  return `<div style="font-weight:700;margin-top:4px">${titre} <span class="sub" style="font-weight:400">${note}</span></div>` + (a.nombre ? `
    <div class="stats num">
      <div><span>${t("bilan.closes")}</span><b>${fmt(a.nombre, 0)}</b></div>
      <div><span>${t("bilan.gagnantes")}</span><b>${pc(a.gagnantes_pct, 0)}</b></div>
      <div><span>${t("bilan.moy")}</span><b class="${cls(a.moyenne_pct)}">${pct(a.moyenne_pct)}</b></div>
      <div><span>${t("bilan.pire")}</span><b class="${cls(a.pire_pct)}">${pct(a.pire_pct)}</b></div></div>
    ${regles.length ? `<table style="margin-top:8px"><tr><th>${t("bilan.regle")}</th><th class="r">${t("bilan.nb")}</th><th class="r">${t("bilan.gagn")}</th><th class="r">${t("bilan.moy.c")}</th></tr>
      ${regles.map(([c, r]) => `<tr><td>${esc(nomRegle(c))}</td><td class="r">${fmt(r.nombre, 0)}</td><td class="r">${pc(r.gagnantes_pct, 0)}</td><td class="r ${cls(r.moyenne_pct)}">${pct(r.moyenne_pct)}</td></tr>`).join("")}</table>` : ""}`
    : `<div class="vide">${vide}</div>`) + (b?.dernieres?.length ? `
    <table style="margin-top:10px"><tr><th>${t("bilan.signal")}</th><th>${t("bilan.valeur")}</th><th class="r">${t("bilan.resultat")}</th></tr>
      ${b.dernieres.slice(0, 15).map(l => `<tr data-isin="${l.isin}" class="row-bilan" style="cursor:pointer"><td>${dateCourte(l.date_signal)}</td>
        <td><b>${esc(l.nom)}</b><div class="sub">${esc(nomRegle(l.regle))} · ${esc(etat(l))}</div></td>
        <td class="r ${cls(+l.resultat_pct)}">${l.resultat_pct === "" || l.resultat_pct == null ? "—" : pct(+l.resultat_pct)}</td></tr>`).join("")}</table>` : "");
}
function rendreBilan() {
  const r = D.bilan_reel, c = D.bilan_reconstitue;
  $("#bilan").innerHTML =
    carteBilan(t("bilan.reel"), r?.debut ? t("bilan.depuis", {d: dateCourte(r.debut)}) : "", r,
      r?.en_cours ? t("bilan.vide.encours", {n: r.en_cours}) : t("bilan.vide.reel")) +
    `<div style="height:16px"></div>` +
    carteBilan(t("bilan.recons"), t("bilan.recons.note"), c, t("bilan.vide.recons")) +
    `<div class="sub" style="margin-top:8px">${t("bilan.explication")}</div>`;
}
let filtreSugg = "validees";
function rendreSuggestions() {
  let l = TOUTES_SUGG;
  if (filtreSugg === "validees") l = l.filter(s => s.fiable);
  if (filtreSugg === "achat") l = l.filter(s => s.sens === "achat");
  if (filtreSugg === "vente") l = l.filter(s => s.sens === "vente");
  $("#s-signaux").textContent = t("plus.signaux", {n: TOUTES_SUGG.length});
  $("#liste-sugg").innerHTML = l.map(carteSugg).join("") || `<div class="vide" style="margin-top:8px">${filtreSugg === "validees" ? t("sugg.vide.validees") : t("sugg.vide")}</div>`;
}

/* ---------- Portefeuille et alertes ---------- */
function evaluer(p) {
  const f = PAR_ISIN[p.isin];
  const cours = f ? f.cours : null;
  const cout = p.qte * p.prix + frais(p.qte * p.prix, "achat");
  const valeur = cours == null ? null : p.qte * cours;
  const net = valeur == null ? null : valeur - frais(valeur, "vente") - cout;
  return {f, cours, cout, valeur, net, netPct: net == null ? null : net / cout * 100};
}
function alertesPortefeuille() {
  const a = [];
  PF.forEach(p => {
    const e = evaluer(p), f = e.f;
    if (!f) return a.push({t: "warn", isin: p.isin, id: p.id, titre: p.nom, txt: t("al.indispo")});
    const stop = p.stop ?? R.stop, obj = p.objectif ?? R.objectif;
    if (e.netPct != null && e.netPct <= stop) a.push({t: "baisse", isin: p.isin, id: p.id, titre: f.nom, txt: t("al.stop", {v: pct(e.netPct), s: pct(stop)})});
    if (e.netPct != null && e.netPct >= obj) a.push({t: "hausse", isin: p.isin, id: p.id, titre: f.nom, txt: t("al.obj", {v: pct(e.netPct), s: pct(obj)})});
    (f.suggestions || []).filter(s => s.sens === "vente").forEach(s =>
      a.push({t: "warn", isin: p.isin, id: p.id, titre: f.nom, txt: t("al.vente", {r: nomRegle(s.code), f: s.fiable ? t("al.vente.f") : ""})}));
    if (f.var_jour != null && f.var_jour <= -4) a.push({t: "baisse", isin: p.isin, id: p.id, titre: f.nom, txt: t("al.baisse", {v: pct(f.var_jour)})});
    if (!f.a_jour) a.push({t: "warn", isin: p.isin, id: p.id, titre: f.nom, txt: t("al.nonech")});
  });
  return a;
}
function rendrePortefeuille() {
  const ev = PF.map(p => ({p, ...evaluer(p)}));
  const cout = ev.reduce((s, e) => s + e.cout, 0);
  const valeur = ev.reduce((s, e) => s + (e.valeur ?? 0), 0);
  const net = ev.reduce((s, e) => s + (e.net ?? 0), 0);
  const al = alertesPortefeuille();
  $("#pf-resume").innerHTML = `<div class="sub">${t("pf.net")}</div>
    <div class="gros-net num ${cls(net)}">${(net > 0 ? "+" : "") + mad(net, 0)}</div>
    <div class="sub num">${pct(cout ? net / cout * 100 : null)} · ${t("pf.lignes", {n: PF.length})}</div>
    <div class="kpis">
      <div class="kpi"><span>${t("pf.valeur")}</span><b class="num">${mad(valeur, 0)}</b></div>
      <div class="kpi"><span>${t("pf.cout")}</span><b class="num">${mad(cout, 0)}</b></div></div>
    <div class="btns"><button class="btn primary" id="b-ajout" type="button">${t("pf.ajouter")}</button></div>`;
  $("#badge-pf").textContent = al.length; $("#badge-pf").classList.toggle("hidden", !al.length);
  $("#bandeau-alertes").innerHTML = al.length ? `<button class="alerte-bandeau" type="button" data-goto="pf"><span>⚠ ${t("prop.alertes", {n: al.length})}</span><span aria-hidden="true">›</span></button>` : "";
  $("#pf-liste").innerHTML = `<div style="font-weight:700">${t("pf.positions")} <span class="sub" style="font-weight:400">${t("pf.toucher")}</span></div>` + (ev.length
    ? ev.map(e => `<div class="pos" data-pos="${e.p.id}" role="button" tabindex="0">
        <div class="h"><span class="n">${esc(e.p.nom)}</span><b class="num ${cls(e.net)}">${pct(e.netPct)}</b></div>
        <div class="h sub num"><span>${fmt(e.p.qte, 0)} × ${fmt(e.p.prix)} · ${dateCourte(e.p.date)}</span><span>${t("pf.col.cours")} ${fmt(e.cours)} · ${(e.net > 0 ? "+" : "") + fmt(e.net, 0)}</span></div>
        ${al.filter(a => a.id === e.p.id).map(a => `<div class="alerte ${a.t}">${esc(a.txt)}</div>`).join("")}</div>`).join("")
    : `<div class="vide" style="margin-top:8px">${t("pf.vide")}</div>`);
}

function optionsValeurs(sel) {
  return [...V].sort((a, b) => a.nom.localeCompare(b.nom, "fr")).map(f => `<option value="${f.isin}" ${f.isin === sel ? "selected" : ""}>${esc(f.nom)}</option>`).join("");
}
const boutonFermer = () => `<button class="close" type="button" aria-label="${t("fermer")}">×</button>`;
function formPosition(id, isinDefaut) {
  const p = PF.find(x => x.id === id) || {isin: isinDefaut || V[0]?.isin, qte: "", prix: PAR_ISIN[isinDefaut]?.cours ?? "", date: aujourdhui()};
  ouvrirPanneau(`${boutonFermer()}<h3>${id ? t("pos.modif") : t("pos.ajout")}</h3>
    <label for="p-isin">${t("pos.valeur")}</label><select id="p-isin">${optionsValeurs(p.isin)}</select>
    <div class="form2">
      <div><label for="p-qte">${t("pos.qte")}</label><input id="p-qte" type="number" inputmode="numeric" value="${p.qte}"></div>
      <div><label for="p-prix">${t("pos.prix")}</label><input id="p-prix" type="number" step="0.01" inputmode="decimal" value="${p.prix}"></div>
      <div><label for="p-date">${t("pos.date")}</label><input id="p-date" type="date" value="${p.date}"></div>
      <div><label for="p-seuils">${t("pos.seuils")}</label><input id="p-seuils" dir="ltr" placeholder="${R.stop} / ${R.objectif}" value="${p.stop != null ? p.stop + " / " + p.objectif : ""}"></div>
    </div>
    <div class="btns"><button class="btn primary" id="p-ok" type="button">${t("pos.ok")}</button>
      ${id ? `<button class="btn" id="p-fiche" type="button">${t("pos.fiche")}</button><button class="btn danger" id="p-suppr" type="button">${t("pos.suppr")}</button>` : ""}</div>`);
  $("#p-ok").onclick = () => {
    const isin = $("#p-isin").value, qte = +$("#p-qte").value, prix = +$("#p-prix").value;
    if (!(qte > 0 && prix > 0)) return alert(t("pos.manque"));
    const s = $("#p-seuils").value.split("/").map(x => parseFloat(x.replace(",", ".")));
    const pos = {id: id || Date.now().toString(36), isin, nom: PAR_ISIN[isin]?.nom || isin, qte, prix, date: $("#p-date").value,
      stop: isNaN(s[0]) ? null : s[0], objectif: isNaN(s[1]) ? null : s[1]};
    PF = id ? PF.map(x => x.id === id ? pos : x) : [...PF, pos];
    sauver(); fermer(); rendrePortefeuille(); rendreAujourdhui();
  };
  if (id) {
    $("#p-fiche").onclick = () => { fermer(); ouvrirFiche(p.isin); };
    $("#p-suppr").onclick = () => { if (confirm(t("pos.suppr.q"))) { PF = PF.filter(x => x.id !== id); sauver(); fermer(); rendrePortefeuille(); rendreAujourdhui(); } };
  }
}

/* ---------- Simulation ---------- */
function rendreSimulation() {
  const pos = Object.entries(SIM.positions).map(([isin, p]) => {
    const f = PAR_ISIN[isin], valeur = f ? p.qte * f.cours : 0;
    return {isin, ...p, f, valeur, net: valeur - frais(valeur, "vente") - p.cout};
  });
  const valeurPos = pos.reduce((s, p) => s + p.valeur, 0);
  const total = SIM.cash + valeurPos, perf = (total / SIM.capital - 1) * 100;
  $("#sim-resume").innerHTML = `<div style="font-weight:700">${t("sim.titre")} <span class="sub" style="font-weight:400">${t("sim.depart", {v: mad(SIM.capital, 0)})}</span></div>

/* ---------- Ma méthode : acheter près du plus bas, revendre à +X % ---------- */
const OBJ = [1, 1.5, 2, 3, 5], SEU = [2, 3, 5], DUR = [1, 3, 5, 10];
function tauxFrais() { return {fa: R.courtage * 1.2 / 100, fv: R.courtage * 1.2 / 100 + R.taxe / 100}; }
// Résultat net (%) d'une opération dont la variation brute est g %, frais d'achat et de vente inclus.
function net(g) { const {fa, fv} = tauxFrais(); return ((1 + g / 100) * (1 - fv) / (1 + fa) - 1) * 100; }
function statsGrille(f, o = R.obj, s = R.seuil, d = R.duree) {
  const g = f.strategie?.grille?.[`${o}|${s}|${d}`]; if (!g) return null;
  const [ex, ga, so, ech, moy, med, ordres] = g;
  if (!ex) return {ex: 0, ordres};
  const ev = (ga * net(o) + so * net(-s) + ech * net(moy)) / ex;
  return {ex, ordres, pg: ga / ex * 100, ps: so / ex * 100, pe: ech / ex * 100, med, ev, servi: ordres ? ex / ordres * 100 : null};
}
// Le capital total est réparti à parts égales sur au plus R.lignes valeurs.
const ligneMAD = () => R.capital / Math.max(1, R.lignes);
function planStrat(f, o = R.obj, s = R.seuil, montant = ligneMAD()) {
  const prix = f.cours, cible = prix * (1 + o / 100), stop = prix * (1 - s / 100);
  let q = Math.floor(montant / (prix + frais(prix, "achat"))), limite = false;
  const lim = f.capitaux_moy ? f.capitaux_moy * 0.10 : null;      // ≤ 10 % des capitaux échangés par jour
  if (lim && q * prix > lim) { q = Math.floor(lim / prix); limite = true; }
  const cout = q * prix + frais(q * prix, "achat");
  return {prix, cible, stop, q, montant: q * prix, cout, limite,
    gain: q * cible - frais(q * cible, "vente") - cout, perte: q * stop - frais(q * stop, "vente") - cout};
}
const IDEES = () => V.filter(f => f.strategie?.zone).map(f => ({f, st: statsGrille(f)}))
  .filter(x => x.st && x.st.ex >= 10).sort((a, b) => b.st.ev - a.st.ev);
/* Le panier du matin : les meilleures idées (résultat net moyen positif), une ligne chacune. */
function panier() {
  const choisies = IDEES().filter(x => x.st.ev > 0).slice(0, Math.max(1, R.lignes));
  const lignes = choisies.map(x => ({...x, p: planStrat(x.f)}));
  const achetables = lignes.filter(l => l.p.q > 0);
  const somme = k => achetables.reduce((a, l) => a + l.p[k], 0);
  const engage = somme("cout");
  const attendu = achetables.reduce((a, l) => a + l.p.cout * l.st.ev / 100, 0);
  const delais = achetables.map(l => l.st.med).filter(x => x != null).sort((a, b) => a - b);
  return {lignes, nb: achetables.length, tropChers: lignes.length - achetables.length, engage,
    reste: R.capital - engage, gainMax: somme("gain"), perteMax: somme("perte"), attendu,
    delai: delais.length ? delais[Math.floor(delais.length / 2)] : null};
}
function htmlPanier() {
  const P = panier();
  if (!P.lignes.length) return "";
  const pcCap = x => pct(R.capital ? x / R.capital * 100 : null);
  const k = (lab, val, c = "", sub = "") => `<div class="kpi"><span>${lab}</span><b class="num ${c}">${val}</b>${sub ? `<span class="num">${sub}</span>` : ""}</div>`;
  return `<details class="plus"><summary>${t("pan.titre")} · ${mad(P.engage, 0)}</summary><div class="corps">
    <div class="sub">${t("pan.repart", {c: mad(R.capital, 0), n: R.lignes, l: mad(ligneMAD(), 0)})}</div>
    <div class="kpis">
      ${k(t("pan.engage", {n: P.nb}), mad(P.engage, 0))}

      ${k(t("pan.pire", {s: pct(-R.seuil)}), mad(P.perteMax, 0), cls(P.perteMax), pcCap(P.perteMax))}
      ${k(t("pan.delai"), P.delai == null ? "—" : t("strat.n", {n: fmt(P.delai, 0)}))}
    </div>
    ${P.tropChers ? `<div class="sub" style="margin-top:6px">${t("pan.chers", {n: P.tropChers, l: mad(ligneMAD(), 0)})}</div>` : ""}
    <div class="sub" style="margin-top:6px">${t("pan.note")}</div></div></details>`;
}

/* ---------- Propositions du jour ----------
   fav  : méthode positive sur 3 ans après frais, ou règle validée déclenchée ;
   surv : dans la zone d'achat, mais résultat passé négatif ;
   vente: signal de vente validé, ou sur une valeur détenue. */
const ORDRE = {fav: 0, vente: 1, surv: 2};
function raisonZone(f, st) {
  const a = f.ecart_bas_52s != null && f.ecart_bas_52s <= 10 ? t("prop.r.bas", {b: pc(f.ecart_bas_52s, 1)}) : t("prop.r.baisse", {v: pct(f.var_5j)});
  return a + " · " + t("prop.r.stats", {g: pc(st.pg, 0), ev: pct(st.ev)});
}
function propositions() {
  const m = new Map(), detenues = new Set(PF.map(p => p.isin));
  IDEES().forEach(x => m.set(x.f.isin, {f: x.f, st: x.st, statut: x.st.ev > 0 ? "fav" : "surv", raisons: [raisonZone(x.f, x.st)]}));
  TOUTES_SUGG.filter(s => s.fiable && s.sens === "achat").forEach(s => {
    const o = m.get(s.f.isin) || {f: s.f, st: statsGrille(s.f), statut: "fav", raisons: []};
    o.statut = "fav"; o.raisons.unshift(t("prop.r.regle", {r: nomRegle(s.code), t: pc(s.taux_reussite, 0)}));
    m.set(s.f.isin, o);
  });
  TOUTES_SUGG.filter(s => s.sens === "vente" && (s.fiable || detenues.has(s.f.isin))).forEach(s => {
    const o = m.get(s.f.isin), r = t("prop.r.vente", {r: nomRegle(s.code), f: detenues.has(s.f.isin) ? t("prop.r.detenue") : ""});
    if (!o) m.set(s.f.isin, {f: s.f, st: statsGrille(s.f), statut: "vente", raisons: [r]});
    else { if (detenues.has(s.f.isin)) o.statut = "vente"; o.raisons.push(r); }

  return [...m.values()].sort((a, b) => ORDRE[a.statut] - ORDRE[b.statut] || (b.st?.ev ?? -99) - (a.st?.ev ?? -99));
}

/* ---------- Simulateur : rejoue l'historique d'une valeur avec un vrai carnet d'ordres ---------- */
function simuler(H, o, s, d, zoneSeule) {
  const n = H.c.length, c = H.c, h = H.h.map((x, i) => x ?? c[i]), b = H.b.map((x, i) => x ?? c[i]), v = H.v.map(x => x || 0);
  const sig = new Array(n).fill(!zoneSeule);
  if (zoneSeule) {
    let somme = 0; const cap = [];
    for (let i = 0; i < n; i++) {
      somme += v[i] * c[i]; if (i >= 63) somme -= v[i - 63] * c[i - 63];
      const nb = Math.min(i + 1, 63); cap.push(nb >= 20 ? somme / nb : null);
      let bas = Infinity; if (i >= 119) for (let k = Math.max(0, i - 249); k <= i; k++) bas = Math.min(bas, c[k]);
      const presBas = bas < Infinity && c[i] <= bas * 1.10, baisse = i >= 5 && c[i] / c[i - 5] - 1 <= -0.05;
      sig[i] = (presBas || baisse) && cap[i] != null && cap[i] >= 300000;
    }
  }
  const ops = []; let ordres = 0, i = 0;
  while (i < n - 1) {
    if (!sig[i]) { i++; continue; }
    ordres++;
    const prix = c[i], j = i + 1;
    if (b[j] > prix) { i++; continue; }
    const cible = prix * (1 + o / 100), stop = prix * (1 - s / 100), fin = Math.min(i + d, n - 1);
    let issue = null, g = 0, delai = null;
    for (let k = j; k <= fin; k++) {
      if (b[k] <= stop) { issue = "seuil"; g = -s; break; }
      if (h[k] >= cible) { issue = "objectif"; g = o; delai = k - j + 1; break; }
    }
    if (!issue) { issue = "echeance"; g = (c[fin] / prix - 1) * 100; }
    ops.push({date: H.d[i], issue, g, net: net(g), delai});
    i = fin + 1;
  }
  return {ordres, ops, debut: H.d[0]};
}

/* ---------- Fiche d'une valeur (plein écran) ---------- */
async function chargerHistorique(isin) {
  try { const r = await fetch(`historique/${isin}.json`); if (r.ok) return await r.json(); } catch (e) {}
  return null;
}
function htmlProposition(f) {
  const p = planStrat(f), st = statsGrille(f), zone = f.strategie?.zone;
  const statut = propositions().find(x => x.f.isin === f.isin)?.statut || (zone ? "surv" : "hors");   // même statut que sur la carte
  const verdict = !st || st.ex < 10 ? ["peu", t("fiche.v.peu")] : st.ev > 0 ? ["fav", t("fiche.v.pos")] : ["vente", t("fiche.v.neg")];
  const regleAchat = (f.suggestions || []).find(s => s.sens === "achat" && s.fiable);
  const ventes = (f.suggestions || []).filter(s => s.sens === "vente");
  const pos = PF.filter(x => x.isin === f.isin);
  let posTxt = "";
  if (pos.length) {
    const q = pos.reduce((a, x) => a + x.qte, 0), pm = pos.reduce((a, x) => a + x.qte * x.prix, 0) / q, e = evaluer({isin: f.isin, qte: q, prix: pm});
    posTxt = `<div class="plan num">${t("fiche.position", {q: fmt(q, 0), p: fmt(pm), n: `<b class="${cls(e.net)}">${(e.net > 0 ? "+" : "") + mad(e.net, 0)}</b>`})}</div>`;
  }
  const k = (lab, val, c = "") => `<div><span>${lab}</span><b class="${c}">${val}</b></div>`;
  return `<div class="card prop-txt">

    <p class="num">${p.q > 0 ? t("fiche.p.ligne", {l: mad(ligneMAD(), 0), q: fmt(p.q, 0), g: "+" + mad(p.gain, 0), x: mad(p.perte, 0)}) + (p.limite ? t("plan.liq") : "") : t("fiche.p.cher", {l: mad(ligneMAD(), 0)})}</p>
    ${st && st.ex ? `<p>${t("fiche.p.hist", {n: fmt(st.ex, 0)})}</p>
      <div class="stats num">${k(t("fiche.p.obj"), pc(st.pg, 0))}${k(t("fiche.p.sorties"), pc(st.ps, 0))}${k(t("fiche.p.ech"), pc(st.pe, 0))}${k(t("fiche.p.net"), pct(st.ev), cls(st.ev))}</div>` : ""}
    <div class="verdict"><span class="statut s-${verdict[0]}">${verdict[1]}</span><span class="sub">${t("prop.note")}</span></div>
    ${regleAchat ? `<p class="up">${t("fiche.p.regle", {r: esc(nomRegle(regleAchat.code)), t: pc(regleAchat.taux_reussite, 0)})}</p>` : ""}
    ${ventes.map(s => `<p class="down">${t("fiche.p.vente", {r: esc(nomRegle(s.code))})}</p>`).join("")}
    ${posTxt}
    <div class="btns col">
      <button class="btn primary" type="button" data-ia="analyser" data-isin="${f.isin}">${t("ia.analyser")}</button>
      <button class="btn" type="button" data-ia="verifier" data-isin="${f.isin}">${t("ia.verifier")}</button>

/* ---------- Couches plein écran (fiche, réglages) : le bouton Retour du téléphone les ferme ---------- */
const pile = [];
function ouvrirCouche(sel) {
  const el = $(sel);
  if (!el.hidden) return;
  el.hidden = false; pile.push(el); document.body.classList.add("fige");
  try { history.pushState({couche: pile.length}, ""); } catch (e) {}
}
function retirerCouche() {
  const el = pile.pop(); if (el) el.hidden = true;
  if (!pile.length) document.body.classList.remove("fige");
}
function fermerCouche() { if (history.state && history.state.couche) history.back(); else retirerCouche(); }
function fermerCouches() { const n = pile.length; while (pile.length) retirerCouche(); if (n && history.state && history.state.couche) { try { history.go(-n); } catch (e) {} } }
window.addEventListener("popstate", () => { if (pile.length) retirerCouche(); });

function ouvrirPanneau(html) { $("#panel").innerHTML = html; $("#sheet").classList.add("open"); $("#panel .close").onclick = fermer; }
function fermer() { $("#sheet").classList.remove("open"); }

/* ---------- Installation sur l'écran d'accueil (Android, iPhone, PC) ---------- */
let invitationInstall = null;
const estInstallee = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const estIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const estSafariIOS = () => estIOS() && !/crios|fxios|edgios/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); invitationInstall = e; rendreInstall(); });
window.addEventListener("appinstalled", () => { invitationInstall = null; rendreInstall(); });
function corpsInstall(masquer) {
  const m = masquer ? `<button class="btn" type="button" data-inst-masquer="1">${t("inst.masquer")}</button>` : "";
  if (invitationInstall) return `<div class="btns"><button class="btn primary" type="button" data-installer="1">${t("inst.bouton")}</button>${m}</div>`;
  const etapes = estIOS() ? (estSafariIOS() ? t("inst.ios") : t("inst.ios.autre")) : t("inst.android");
  return `<ol>${etapes.split("|").map(x => `<li>${x}</li>`).join("")}</ol>${m ? `<div class="btns">${m}</div>` : ""}`;
}
function rendreInstall() {
  const el = $("#installer");
  if (estInstallee() || store.get("install_masque", false)) el.classList.add("hidden");
  else { el.innerHTML = `<div style="font-weight:700">${t("inst.titre")}</div><div class="sub">${t("inst.texte")}</div>${corpsInstall(true)}`; el.classList.remove("hidden"); }
  const r = $("#reg-install");
  if (r) r.innerHTML = estInstallee() ? `<div class="sub">${t("reg.install.ok")}</div>` : `<div class="sub">${t("inst.texte")}</div>${corpsInstall(false)}`;
}

// Tout ce qui dépend des données et des réglages (sans les textes fixes).

}

}

/* ---------- Événements ---------- */
document.addEventListener("click", e => {
  const el = e.target;
  if (el.closest("[data-fermer-couche]")) return fermerCouche();
  if (el.closest("#b-reglages") || el.closest("[data-reglages]")) { rendreReglages(); return ouvrirCouche("#reglages"); }
  const ia = el.closest("[data-ia]"); if (ia) { fermer(); fermerCouches(); montrer("ia"); return window.BVC_IA?.[ia.dataset.ia](ia.dataset.isin); }
  if (el.closest("#b-langue")) return changerLangue(LANG === "ar" ? "fr" : "ar");
  const lg = el.closest("[data-langue]"); if (lg) return changerLangue(lg.dataset.langue);
  if (el.closest("[data-installer]") && invitationInstall) {
    invitationInstall.prompt(); Promise.resolve(invitationInstall.userChoice).catch(() => {}).finally(() => { invitationInstall = null; rendreInstall(); }); return;
  }
  if (el.closest("[data-inst-masquer]")) { store.set("install_masque", true); return rendreInstall(); }
  const nav = el.closest("nav.bas button"); if (nav) { fermerCouches(); return montrer(nav.dataset.v); }
  const sg = el.closest("#seg-pf button"); if (sg) return segPf(sg.dataset.seg);
  const go = el.closest("[data-goto]"); if (go) { segPf("reel"); return montrer(go.dataset.goto); }
  const sim = el.closest("[data-sim]"); if (sim) return formSimulation(sim.dataset.sim, "achat", sim.dataset.qte || "");
  const sv = el.closest("[data-simvente]"); if (sv) return formSimulation(sv.dataset.simvente, "vente");
  const det = el.closest("[data-detail]"); if (det) return ouvrirFiche(det.dataset.detail);
  const pos = el.closest("[data-pos]"); if (pos) return formPosition(pos.dataset.pos);
  if (el.closest("#b-ajout")) return formPosition(null);
  if (el.closest("#sim-reset")) {
    const c = prompt(t("sim.reset.q"), SIM.capital);
    if (c == null) return; const cap = +String(c).replace(/\s/g, "").replace(",", ".");
    if (!(cap > 0)) return;
    SIM = {capital: cap, cash: cap, positions: {}, journal: []}; sauver(); return rendreSimulation();
  }

  if (cs) { filtreSugg = cs.dataset.f; $$("#f-sugg .chip").forEach(b => b.setAttribute("aria-pressed", b === cs)); return rendreSuggestions(); }
  if (el === $("#sheet")) fermer();
});
